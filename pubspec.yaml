name: eat_your_meal
description: Eat Your Meal – your beautiful daily meal reminder & food journal.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Persistence
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  # UI
  flutter_slidable: ^3.1.1
  intl: ^0.19.0
  flutter_animate: ^4.5.0
  uuid: ^4.4.2
  provider: ^6.1.2

  # Misc
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
